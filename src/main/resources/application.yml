server:
  port: 8090

spring:
  application:
    name: knowledge
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.2
          temperature: 0.7
      embedding:
        options:
          # Modelo dedicado a generar embeddings, distinto del de chat.
          # Hay que descargarlo aparte: ollama pull nomic-embed-text
          model: nomic-embed-text
  webflux:
    multipart:
      max-in-memory-size: 10MB